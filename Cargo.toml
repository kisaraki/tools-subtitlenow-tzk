[package]
name = "subtitlenow"
default-run = "subtitlenow"
version = "0.1.1"
authors = ["kisaraki"]
repository = "https://github.com/kisaraki/tools-subtitlenow-tzk"
edition = "2024"
publish = false
description = "Windows 應用程式即時翻譯字幕工具"

[dependencies]
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
tokio = { version = "1", features = ["rt", "sync", "signal", "macros", "time", "net", "io-util", "fs"] }
semver = "1"
sha2 = "0.10"
zeroize = "1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
zhconv = { version = "0.4", default-features = false, features = ["opencc", "opencc-twp", "compress"] }
rusty-chromaprint = "=0.3.0"
httpdate = "=1.0.3"
whatlang = { version = "=0.18.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
